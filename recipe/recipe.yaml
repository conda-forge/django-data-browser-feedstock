# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-data-browser
  version: "4.2.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 8c71040ce3ebe5a42c0009ed74c81c96840df860750d62b7e1653dce0452da10

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<4.0
    - django >=4.2
    - hyperlink
    - python-dateutil
    - sqlparse
tests:
  - python:
      imports:
        - data_browser
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  summary: Interactive user-friendly database explorer.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/tolomea/django-data-browser

extra:
  recipe-maintainers:
    - rxm7706
